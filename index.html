<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Timer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Gym Timer</title>
</head>
<body>

  <!-- List of saved intervals -->
  <section id="view-list" class="view active">
    <header class="bar">
      <h1>Intervals</h1>
    </header>
    <ul id="interval-list" class="list"></ul>
    <p id="empty" class="empty" hidden>No Intervals Yet<br>Tap <strong>+</strong> to Create One</p>
    <footer class="list-footer">
      <label class="volume">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        <span class="sr-only">Ding Volume</span>
        <input type="range" id="volume" min="0" max="100" step="5">
        <output id="volume-value">80%</output>
      </label>
    </footer>
    <button id="btn-add" class="fab" aria-label="New Interval"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button>
  </section>

  <!-- Create / edit an interval -->
  <section id="view-edit" class="view">
    <header class="bar">
      <button class="link" id="btn-edit-cancel">Cancel</button>
      <h1 id="edit-title">New Interval</h1>
      <button class="link strong" id="btn-edit-save">Save</button>
    </header>
    <div class="edit-body">
      <div class="preview-name" id="edit-preview">30s x 15s x 3</div>

      <div class="field">
        <label>Sets</label>
        <div class="stepper">
          <button type="button" id="sets-minus" aria-label="Fewer Sets"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <output id="sets-value">3</output>
          <button type="button" id="sets-plus" aria-label="More Sets"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>

      <div class="wheels">
        <div class="wheel-col">
          <label class="high">High</label>
          <div class="wheel" data-key="high"></div>
        </div>
        <div class="wheel-col">
          <label class="low">Low</label>
          <div class="wheel" data-key="low"></div>
        </div>
      </div>
      <div class="wheels">
        <div class="wheel-col">
          <label>Warm Up</label>
          <div class="wheel" data-key="warmup"></div>
        </div>
        <div class="wheel-col">
          <label>Cool Down</label>
          <div class="wheel" data-key="cooldown"></div>
        </div>
      </div>

      <p class="total">Total Time <strong id="edit-total">0:00</strong></p>
      <button class="danger" id="btn-delete" hidden>Delete Interval</button>
    </div>
  </section>

  <!-- Running timer -->
  <section id="view-run" class="view run">
    <header class="bar">
      <button class="link" id="btn-run-close">Close</button>
      <h1 id="run-name"></h1>
      <button class="link" id="btn-run-edit">Edit</button>
    </header>
    <div class="run-body">
      <div class="phase" id="run-phase">Ready</div>
      <div class="clock" id="run-clock">0:00</div>
      <div class="sets" id="run-sets"></div>
      <div class="progress"><div id="run-progress"></div></div>
      <div class="remaining">Remaining <span id="run-remaining">0:00</span></div>
      <div class="controls">
        <button id="btn-reset" class="round small" aria-label="Restart"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" class="stroke"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 3.5v4h4"/></svg></button>
        <button id="btn-play" class="round big">Start</button>
        <button id="btn-skip" class="round small" aria-label="Skip Phase"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 5.2v13.6a1 1 0 0 0 1.5.86l10.2-6.8a1 1 0 0 0 0-1.72L7.5 4.34A1 1 0 0 0 6 5.2z"/><rect x="17.5" y="4.5" width="2.6" height="15" rx="1.3"/></svg></button>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
